<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docker Notes App</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 Notes App</h1>
    <p class="subtitle">Node.js + Express + MongoDB, running in Docker</p>

    <form id="note-form">
      <input type="text" id="note-input" placeholder="Write a note..." autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <ul id="notes-list"></ul>

    <p id="status" class="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
